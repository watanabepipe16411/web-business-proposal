    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブース会場 - WEBビジネス提案会</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: "Arial", sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            margin: 0;
            padding-bottom: 20px;
        }

        /* ヘッダー */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: white;
            width: 100%;
            padding: 15px 20px;
            box-sizing: border-box;
            position: relative; /* スマホでロゴ絶対配置用 */
        }

        .header-left { flex: 0 0 auto; }
        .header-center { flex: 1 1 auto; text-align: center; }
        .header-right { flex: 0 0 auto; text-align: right; }

        /* 戻るボタン */
        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: black;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
        }
        .back-btn:hover { background: rgba(0,0,0,0.05); }

        .header-left button {
            background: #eee;
            border: none;
            border-radius: 25px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .header-left button:hover { background: #ddd; }

        .header-center h1 { font-size: 1.8rem; margin-bottom: 4px; }
        .header-center p { font-size: 1rem; opacity: 0.8; }

        /* 右側社名ロゴ */
        .header-right img.company-logo {
            height: 70px;
            width: auto;
            object-fit: contain;
            margin-left: -15px; /* 微妙に左にずらす */
        }

        /* スライダー */
        .slider-wrap { max-width: 600px; margin: 20px auto 40px; }
        .slider { position: relative; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.25); background: rgba(255,255,255,0.15); backdrop-filter: blur(4px); }
        .slides { width: 100%; }
        .slider .slide { display: none; }
        .slider .slide.active { display: block; animation: fade 0.8s ease; }
        .slider .slide img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
        .slider .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.35); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; font-size: 22px; transition: background 0.2s ease; }
        .slider .nav:hover { background: rgba(0,0,0,0.5); }
        .slider .prev { left: 12px; }
        .slider .next { right: 12px; }
        .slider .dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; padding: 6px 10px; border-radius: 999px; background: rgba(0,0,0,0.25); }
        .slider .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.6); cursor: pointer; transition: transform 0.2s ease, background 0.2s ease; }
        .slider .dot.active { transform: scale(1.2); background: #fff; }
        @keyframes fade { from { opacity: 0.4; } to { opacity: 1; } }

        /* ブースグリッド */
        .booth-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .booth {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .booth::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57, #ff9ff3, #54a0ff, #5f27cd);
        }
        .booth:hover { transform: translateY(-10px); box-shadow: 0 25px 50px rgba(0,0,0,0.2); }

        .booth-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 15px; }
        .booth-logo { height: 60px; width: auto; margin-bottom: 10px; display: block; }
        .booth-title { font-size: 1.5rem; font-weight: bold; color: #333; margin-bottom: 10px; text-align: center; width: 100%; }
        .booth-title.small-title { font-size: 0.9rem; white-space: nowrap; }
        .booth-description { color: #666; margin-bottom: 25px; line-height: 1.6; }
        .booth-buttons { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 12px 25px; border: none; border-radius: 25px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: all 0.3s ease; text-decoration: none; display: inline-block; min-width: 120px; }
        .btn-video { background: linear-gradient(45deg, #ff6b6b, #ee5a24); color: white; }
        .btn-products { background: linear-gradient(45deg, #4ecdc4, #44a08d); color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }

        /* 浮遊パーティクル */
        .floating-particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1;
        }
        .particle { position: absolute; background: rgba(255, 255, 255, 0.1); border-radius: 50%; animation: float-particle 8s ease-in-out infinite; }
        .particle:nth-child(1) { width: 10px; height: 10px; top: 20%; left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 15px; height: 15px; top: 40%; left: 80%; animation-delay: 2s; }
        .particle:nth-child(3) { width: 8px; height: 8px; top: 60%; left: 20%; animation-delay: 4s; }
        .particle:nth-child(4) { width: 12px; height: 12px; top: 80%; left: 70%; animation-delay: 6s; }
        @keyframes float-particle { 0%,100%{transform:translateY(0px) rotate(0deg);opacity:0.3;}50%{transform:translateY(-30px) rotate(180deg);opacity:0.8;} }

        /* メディアクエリ：スマホ対応 */
        @media (max-width: 768px) {
            /* ここを1列から2列に変更 */
            .booth-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
                max-width: 100%;
                padding: 12px;
                margin: 0 auto;
            }
            .booth { padding: 16px; }
            .booth-logo { height: 50px; }
            /* 小さい社名は折り返し許可 */
            .booth-title.small-title { white-space: normal; font-size: 0.95rem; }
            .booth-buttons { flex-direction: column; align-items: center; }
            .btn { width: 100%; max-width: 220px; }

            /* ヘッダー縦並び＆右上ロゴ固定 */
            .header {
                flex-direction: column;   /* ヘッダー縦並び */
                align-items: flex-start;
                position: relative;       /* ロゴ絶対配置用 */
                padding: 20px 15px;
            }
            .header-center {
                text-align: left;
                width: 100%;
                margin: 0;
                padding-right: 60px; /* ロゴと被らないよう余白 */
            }
            .header-right {
                position: absolute;
                top: 15px;
                right: 15px;
            }
            .header-right img.company-logo {
                height: 40px;
                width: auto;
                margin-left: 0;
            }
            .header-left button {
                padding: 6px 12px;
                font-size: 0.9rem;
            }
        }

        /* 極小幅デバイスでは1列に戻す（必要ならこのブロックを調整／
