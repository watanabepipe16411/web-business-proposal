<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>準備中ページ</title>
  <style>
    body {
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Noto Sans JP', 'Meiryo', sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 4px 16px rgba(220, 220, 220, 0.25);
      padding: 48px 32px;
      text-align: center;
      max-width: 400px;
      z-index: 1;
    }
    .cute-icon {
      font-size: 64px;
      margin-bottom: 16px;
      animation: bounce 1.2s infinite alternate;
    }
    @keyframes bounce {
      to { transform: translateY(-16px);}
    }
    h1 {
      font-size: 1.8em;
      color: #ff80ab;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    p {
      font-size: 1.1em;
      color: #666;
      margin-bottom: 0;
    }

    /* 右上のボタン */
    .back-button {
      position: fixed;
      top: 16px;
      right: 16px;
      background-color: #ff80ab;
      color: white;
      padding: 8px 16px;
      border-radius: 24px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: background-color 0.3s ease;
      z-index: 10;
      font-size: 0.9em;
    }
    .back-button:hover {
      background-color: #e75a8d;
    }
  </style>
</head>
<body>
  <a href="booth.html" class="back-button">← ブース会場に戻る</a>

  <div class="container">
    <div class="cute-icon">🐕🐕🐕</div>
    <h1>このページは準備中です。</h1>
    <p>公開までもうしばらくお待ちください💦<br></p>
  </div>
</body>
</html>
