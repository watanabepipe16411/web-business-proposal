<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ブース会場 - WEBビジネス提案会</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: "Arial", sans-serif;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        min-height: 100vh;
        padding-top: 80px; /* ヘッダー固定分の余白 */
    }
    /* --- ヘッダー --- */
    .header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        z-index: 1000;
    }
    .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .back-btn {
        background: #eee;
        color: #333;
        padding: 8px 16px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        font-size: 1rem;
        transition: 0.2s;
    }
    .back-btn:hover {
        background: #ddd;
    }
    .header-center {
        flex: 1;
        text-align: center;
    }
    .header-center h1 {
        font-size: 1.5rem;
        color: #333;
    }
    .header-center p {
        font-size: 0.9rem;
        color: #666;
    }
    .header-right img {
        height: 40px;
        width: auto;
    }

    /* --- スライダーやブースグリッドは元のCSSを流用 --- */
    .slider-wrap {
        max-width: 600px;
        margin: 20px auto 40px;
    }
    .slider {
        position: relative;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(4px);
    }
    .slides { width: 100%; }
    .slider .slide { display: none; }
    .slider .slide.active { display: block; animation: fade 0.8s ease; }
    .slider .slide img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
    .slider .nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.35); color:#fff; border:none; width:44px; height:44px; border-radius:50%; cursor:pointer; display:grid; place-items:center; font-size:22px; transition:0.2s; }
    .slider .nav:hover { background: rgba(0,0,0,0.5); }
    .slider .prev { left: 12px; }
    .slider .next { right: 12px; }
    .slider .dots { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); display:flex; gap:8px; padding:6px 10px; border-radius:999px; background: rgba(0,0,0,0.25); }
    .slider .dot { width:10px; height:10px; border-radius:50%; background: rgba(255,255,255,0.6); cursor:pointer; transition:0.2s; }
    .slider .dot.active { transform: scale(1.2); background: #fff; }
    @keyframes fade { from {opacity:0.4;} to {opacity:1;} }

    .booth-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 30px;
        max-width: 1200px;
        margin: 0 auto;
    }
    .booth {
        background: rgba(255,255,255,0.95);
        border-radius: 20px;
        padding: 30px;
        text-align: center;
        box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    .booth::before {
        content:"";
        position:absolute;
        top:0; left:0; right:0;
        height:5px;
        background: linear-gradient(90deg, #ff6b6b,#4ecdc4,#45b7d1,#96ceb4,#feca57,#ff9ff3,#54a0ff,#5f27cd);
    }
    .booth:hover { transform:translateY(-10px); box-shadow:0 25px 50px rgba(0,0,0,0.2); }
    .booth-header { display:flex; flex-direction:column; align-items:center; margin-bottom:15px; }
    .booth-logo { height:60px; margin-bottom:10px; }
    .booth-title { font-size:1.5rem; font-weight:bold; color:#333; margin-bottom:10px; text-align:center; }
    .booth-title.small-title { font-size:0.9rem; white-space:nowrap; }
    .booth-description { color:#666; margin-bottom:25px; line-height:1.6; }
    .booth-buttons { display:flex; gap:15px; justify-content:center; flex-wrap:wrap; }
    .btn { padding:12px 25px; border:none; border-radius:25px; cursor:pointer; font-size:1rem; font-weight:bold; transition:0.3s; text-decoration:none; min-width:120px; display:inline-block; }
    .btn-video { background: linear-gradient(45deg, #ff6b6b,#ee5a24); color:white; }
    .btn-products { background: linear-gradient(45deg, #4ecdc4,#44a08d); color:white; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,0.2); }
    @media (max-width:768px) {
        .booth-grid { grid-template-columns:1fr; gap:20px; }
        .booth { padding:20px; }
        .booth-buttons { flex-direction:column; align-items:center; }
        .btn { width:100%; max-width:200px; }
    }
</style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <button class="back-btn" onclick="goBack()">戻る</button>
        </div>
        <div class="header-center">
            <h1>🏢 ブース会場</h1>
            <p>各メーカーのブースで最新情報と商品をチェックしよう！</p>
        </div>
        <div class="header-right">
            <img src="【JPG】SEDIAlogo.jpg" alt="会社ロゴ">
        </div>
    </div>

    <!-- slideshow -->
    <div class="slider-wrap">
        <div id="slider" class="slider">
            <div class="slides"></div>
            <button class="nav prev" aria-label="前へ">‹</button>
            <button class="nav next" aria-label="次へ">›</button>
            <div class="dots" id="sliderDots"></div>
        </div>
    </div>

    <div class="booth-grid">
        <!-- ここに各ブースカードを元のコード通りに挿入 -->
    </div>

<script>
function goBack() {
    window.location.href = "index.html";
}
// スライダー初期化コードは元のまま
</script>
</body>
</html>
