<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渡辺パイプWEBビジネス提案会 2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Arial", sans-serif;
            background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            max-width: 600px;
            width: 90%;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .logo img {
            width: 280px;
            max-width: 80%;
            height: auto;
            margin-bottom: 20px;
            animation: bounceIn 1s;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.6); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        .logo-text {
            font-size: 2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #555;
            margin-bottom: 40px;
            font-weight: 300;
            animation: fadeInUp 1.5s;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px);}
            to { opacity: 1; transform: translateY(0);}
        }

        .entrance-btn {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            padding: 20px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 114, 255, 0.3);
            position: relative;
            overflow: hidden;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0,114,255,0.4);}
            70% { box-shadow: 0 0 30px 20px rgba(0,114,255,0);}
            100% { box-shadow: 0 0 0 0 rgba(0,114,255,0);}
        }

        .entrance-btn:hover {
            transform: translateY(-3px) scale(1.05);
            background: linear-gradient(45deg, #5ee7df, #b490ca);
        }

        /* その他の部分は元のまま省略 */

    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="【JPG】SEDIAlogo.jpg" alt="渡辺パイプロゴ">
        </div>
        <div class="logo-text">WEBビジネス提案会 2025</div>
        <p class="subtitle">最新情報セミナー動画 & おすすめ商品をチェック</p>
        
        <button class="entrance-btn" onclick="showPasswordModal()">
            <span id="btn-emoji">🚀</span> ブース会場へ入場する
        </button>
    </div>
</body>
</html>
